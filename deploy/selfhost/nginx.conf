# Template — container thay ${NGINX_MAX_BODY} bằng envsubst lúc khởi động.
events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    client_max_body_size ${NGINX_MAX_BODY};

    upstream web { server web:3000; }
    upstream app { server app:8080; }

    server {
        listen 80;
        server_name _;

        # WebSocket realtime -> backend (same-origin /ws).
        location /ws {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
        }

        # File/ảnh -> MinIO gói sẵn (MINIO_PUBLIC_URL = <origin>/cdn). Dùng biến +
        # resolver để nginx VẪN KHỞI ĐỘNG khi bạn dùng S3 ngoài (không có service minio).
        location /cdn/ {
            resolver 127.0.0.11 valid=30s;
            set $minio_up "minio:9000";
            rewrite ^/cdn/(.*)$ /$1 break;
            proxy_pass http://$minio_up;
            proxy_set_header Host $host;
        }

        # Mọi thứ còn lại -> web (gồm /api/proxy, trang public /f/{token}, tĩnh).
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
