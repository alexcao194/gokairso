worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_origin $cors_origin {
        default $http_origin;
        "" "";
    }

    # nginx doesn't forward the Upgrade/Connection headers to the upstream by
    # default, which silently breaks the WebSocket handshake (gorilla/websocket
    # rejects it with 400) while every other request keeps working fine.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream app_server {
        server app:8080;
    }

    server {
        listen 80;
        server_name _;

        location /ws {
            proxy_pass http://app_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket connections are long-lived; the hub pings every ~54s,
            # so the default 30s REST timeout below would kill them first.
            proxy_connect_timeout 30s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location / {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-App-Token, X-Conn-Id, X-Requested-With, Accept, Origin" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Vary Origin always;
                add_header Content-Length 0;
                return 204;
            }

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-App-Token, X-Requested-With, Accept, Origin" always;
            add_header Vary Origin always;

            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check for nginx itself
        location /nginx-health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
