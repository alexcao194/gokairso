host: 192.168.1.4:8041
info:
  contact: {}
  description: API for Kairso
  title: Kairso API
  version: "1.0"
paths:
  /public/projects/{token}:
    get:
      description: No authentication required — gated only by the unguessable token.
      parameters:
      - description: Public feedback token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PublicProjectResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get Public Project Info
      tags:
      - PublicFeedback
  /public/projects/{token}/feedbacks:
    get:
      description: No authentication required — gated only by the unguessable token.
      parameters:
      - description: Public feedback token
        in: path
        name: token
        required: true
        type: string
      - description: Comma-separated list of priorities to filter by (1-4), e.g. '2,3'
        in: query
        name: priority
        type: string
      - description: Filter by whether a Response has been set
        in: query
        name: hasResponse
        type: boolean
      - description: 'Comma-separated list of triage statuses to filter by: pending,
          discussing, acknowledged, in_progress, resolved, deployed, canceled'
        in: query
        name: status
        type: string
      - description: 'Comma-separated list of types to filter by: feature, improvement,
          bug'
        in: query
        name: feedbackType
        type: string
      - description: Search submitter name/company, feature name, content, response,
          and code
        in: query
        name: q
        type: string
      - description: 'Comma-separated sort fields, each optionally suffixed with :asc
          or :desc (default asc), e.g. ''priority:desc,submitted:asc''. Defaults to
          submitted desc when omitted. Valid fields: code, priority, feature, submitter,
          company, status, expectedFix, submitted'
        in: query
        name: sort
        type: string
      - in: query
        name: limit
        type: integer
      - in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ProjectFeedbackListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List Public Feedback Board
      tags:
      - PublicFeedback
    post:
      consumes:
      - application/json
      description: No authentication required — gated only by the unguessable token.
      parameters:
      - description: Public feedback token
        in: path
        name: token
        required: true
        type: string
      - description: Feedback
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateProjectFeedbackRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ProjectFeedbackResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Submit Public Feedback
      tags:
      - PublicFeedback
  /public/projects/{token}/files:
    get:
      parameters:
      - description: Public feedback token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TreeResponse'
      summary: Public file tree for a project (token-gated)
      tags:
      - Files
  /public/projects/{token}/modules:
    get:
      description: No authentication required. Returns modules if project timeline
        is enabled.
      parameters:
      - description: Public feedback token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/PublicModuleResponse'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List Public Modules
      tags:
      - PublicFeedback
  /public/projects/{token}/uploads/presigned-url:
    post:
      consumes:
      - application/json
      description: No authentication required — gated only by the unguessable token.
        Client PUTs the file directly to object storage using the returned URL.
      parameters:
      - description: Public feedback token
        in: path
        name: token
        required: true
        type: string
      - description: Upload metadata
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PublicUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
