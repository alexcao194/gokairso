        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Create Presigned Upload URL For A Feedback Photo
      tags:
      - PublicFeedback
  /v1/auth/firebase/login:
    post:
